# Nixpacks build for Railway.
# Node is present only to compile the Tailwind stylesheet at build time;
# nothing in the running application depends on it.

[phases.setup]
nixPkgs = ["python312", "nodejs_20", "gcc"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements-postgres.txt",
  "npm ci --omit=dev || npm install"
]

[phases.build]
cmds = [
  "npx tailwindcss -i static/css/input.css -o static/css/app.css --minify"
]

[start]
cmd = "gunicorn app:app -c gunicorn.conf.py"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"
