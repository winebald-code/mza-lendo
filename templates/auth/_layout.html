<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>500 — Server Error — {{ APP_NAME|default('Bacaan') }}</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#F2F4F6">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ asset('css/app.css') }}">
    <link rel="stylesheet" href="{{ asset('css/handset.css') }}">
</head>
<body class="bg-fog h-full font-sans antialiased text-slate-900">
{% from "partials/icons.html" import icon, sprite %}
{{ sprite() }}

<div class="min-h-screen flex flex-col items-center justify-center px-5 py-12 text-center">
    <div class="w-full max-w-md mx-auto flex flex-col items-center">
        <!-- Logo Header -->
        <a href="{{ url_for('public.index') }}" class="inline-flex items-center gap-2.5 mb-8 focus:outline-none group">
            {% include "partials/logo.html" %}
            <span class="font-display font-bold text-xl tracking-[-0.02em] text-slate-900 group-hover:opacity-80 transition-opacity">Bacaan</span>
        </a>

        <!-- Large 500 Graphic -->
        <div class="font-display font-black text-8xl sm:text-9xl tracking-tighter text-slate-200 select-none mb-2">
            500
        </div>

        <!-- Error Content -->
        <h1 class="font-display font-bold text-3xl sm:text-4xl text-slate-900 tracking-tight mb-3">
            The line stopped
        </h1>
        <p class="text-slate-600 text-base sm:text-lg leading-relaxed mb-8 max-w-sm">
            Something failed on our side. The fault has been logged and nothing you entered was lost.
        </p>

        <!-- Actions -->
        <div class="flex flex-row gap-3 items-center justify-center">
            <a href="{{ url_for('public.index') }}" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full bg-signal-500 font-medium text-white hover:bg-signal-600 transition-colors focus:outline-none focus:ring-2 focus:ring-signal-500/50">
                {{ icon('arrow-left', 'ico ico-sm') }}
                Back to the homepage
            </a>
            <a href="{{ url_for('auth.login') }}" class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full border border-slate-300 bg-white font-medium text-slate-700 hover:bg-slate-50 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400">
                Sign in
            </a>
        </div>
    </div>
</div>

<script nonce="{{ csp_nonce }}" src="{{ asset('js/app.js') }}" defer></script>
</body>
</html>
